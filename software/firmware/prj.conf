# pA-Converter V4.0 固件配置
# 板级硬约束(LFRC / DCDCEN=n / 无 UART)在
# boards/arm/pa_converter_v40/pa_converter_v40_defconfig,**不在这里**。

# ---- 外设 ----
CONFIG_GPIO=y
CONFIG_SPI=y

# 🔴 看门狗必配:CR2032 brownout 会落进 POR 盲区、不自恢复(board_guards.c)
CONFIG_WATCHDOG=y

# ---- 数据通路:RTT ----
# 调试口 CN1 只有 SWDIO/SWCLK/nRESET/VTref/GND,**没引 UART**
# ⇒ 不开 BLE 时 RTT 是唯一有线数据通路。
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_RTT_OUTPUT_BUFFER_SIZE=256

# 采样率仅 ~0.27 SPS,数据量极小;缓冲给足以免启动期日志把数据行挤掉
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
# 🔴 64→256(2026-08-10):一条最长命令(全部键 + FORCE)约 111 字符,64 装不下
# ⇒ 会被截成两段,而后半段有可能被当成一条独立命令执行。另外 commit 期间要回读
# 十几个寄存器(几十 ms),这期间上位机可能已经排了第二条命令。
# ⚠️ 保持 NO_BLOCK_SKIP 不改:BLOCK 会拖死采集循环并饿死看门狗,TRIM 会产出
#    可能被误解析的残行。丢整行 + 上位机用 GET 幂等重放,是唯一安全的组合。
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=256

# ---- 🔴 刻意不开 BLE ----
# 用户 2026-07-31 拍板:蓝牙一时半会不用。
# 连带好处:DEC5 缺 820pF 的风险窗口正是 BLE TX 的 mA 级电流突变(见 07 文档 §2.4),
# 不开 BLE 就绕开了它。**开 BLE 前必须先处置 DEC5。**
CONFIG_BT=n

# ---- 健壮性 ----
# 🔴 2048→4096(2026-08-10):一条 OCP 命令就把栈撑爆了
# (ZEPHYR FATAL ERROR 2: Stack overflow ⇒ Halting system)。
# 主因已修(审计行的 640B 格式化缓冲从栈移到静态),但纵深防御照样要加:
# 命令处理链 wait_for_start → poll_control_command → handle_command_line →
# afe_cfg_commit → exec_plan → printk 有 6 层,其中三层各带 ~150B 结构体。
# RAM 只用了 9.3%/128KB,这 2KB 白给。
CONFIG_MAIN_STACK_SIZE=4096
# 栈溢出必须**报出来**而不是静默跑飞 —— 本次能一眼定位就是靠它。
CONFIG_THREAD_STACK_INFO=y
CONFIG_ASSERT=y
# 栈保护用 MPU(nRF52833 有 MPU,由板 defconfig 的 CONFIG_HW_STACK_PROTECTION 开)。
# ⚠️ 2026-07-31 实测:**不要**再加 CONFIG_STACK_SENTINEL —— 它
# `depends on !MPU_STACK_GUARD`,与 HW_STACK_PROTECTION 互斥,同时开会中止构建。
# 硬件 MPU 保护严格强于软件哨兵,所以留 MPU、删 sentinel。

# 本版不用浮点(所有换算走 int64 整数,见 lib/max30131)
CONFIG_CBPRINTF_FP_SUPPORT=n
