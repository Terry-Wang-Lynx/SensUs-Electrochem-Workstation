# V5.1 native USB data/control transport.  This file is applied only to V5.1.
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USB_DEVICE_PRODUCT="pA-Converter V5.1"
CONFIG_USB_DEVICE_REMOTE_WAKEUP=n

# Existing printk data and audit lines are routed unchanged to DATA CDC.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_RTT_CONSOLE=n

# Keep RTT logs as an independent diagnostic path when an SWD probe is fitted.
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y

# SMP CDC supports an application reset into MCUboot's five-second recovery.
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_MCUMGR_GRP_OS=y
