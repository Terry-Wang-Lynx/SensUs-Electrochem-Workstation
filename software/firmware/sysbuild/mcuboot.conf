# MCUboot 镜像的配置片段(sysbuild 会把它作为 mcuboot image 的 EXTRA_CONF 应用)
#
# 目标:**USB CDC ACM serial recovery**,上电等一个窗口,超时才跑 app。
#
# 🔴 为什么本板必须是这种"上电等窗口"式:
#    V5.1 上除 USB-C 与 CN1(SWDIO/SWCLK/nRESET/VTref/GND)之外**没有任何物理输入**
#    —— 无按键、无测试点、无引出 GPIO(2026-08-12 逐器件核过 26 个件)。
#    ⇒ `BOOT_SERIAL_ENTRANCE_GPIO` 这类方案不可用;
#    ⇒ 而 `BOOT_SERIAL_NO_APPLICATION` 让「app 变砖」也能纯 USB 救回来,
#      这是本板唯一的软砖出路(硬出路仍是 CN1 的 SWD)。
#
# 🔴 取值来源:逐条抄自 MCUboot 自带的 nRF52 板配置
#    ~/ncs/bootloader/mcuboot/boot/zephyr/boards/ctcc_nrf52840.conf
#    符号存在性已在本地 NCS v3.4.0 树里 grep 核实(Kconfig.serial_recovery),不是凭记忆写。
#
# 为什么不用 `BOOT_USB_DFU_WAIT`(dfu-util 那条路):
#    ① 它在 MCUboot 的 Kconfig 里挂着 `imply DEPRECATION_TEST`(旧 USB 栈将被弃用);
#    ② NCS 官方文档与 nrf_desktop 主推的是 serial recovery;
#    ③ V5.1 的数据通路(Phase 2)本来就是 USB CDC ⇒ 主机侧只需要一种 USB 类。
#    行为上两者一致(都是"上电等一个窗口"),所以这不改变已拍板的方案。

# ---- 日志:板上无 UART,MCUboot 里也不开 RTT(省 flash)----
CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# ---- MCUboot serial recovery over USB CDC ACM ----
CONFIG_MCUBOOT_SERIAL=y
# 无按键 ⇒ 不用 GPIO 触发
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n
CONFIG_BOOT_SERIAL_CDC_ACM=y
# 上电等窗口(用户 2026-08-12 拍板的方案)
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=5000
# 🔴 没有可引导 app 就**停在 recovery**,不要跳进空 slot ⇒ 软砖可纯 USB 救
CONFIG_BOOT_SERIAL_NO_APPLICATION=y
# 明确关掉另一条路,避免两个 USB 类同时被 select
CONFIG_BOOT_USB_DFU_WAIT=n

# ---- USB 栈(serial recovery 依赖)----
# MULTITHREADING 是 USB 栈的硬依赖(BOOT_SERIAL_WAIT_FOR_DFU 也 select 它,显式写出来备查)
CONFIG_MULTITHREADING=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_REMOTE_WAKEUP=n
CONFIG_USB_DEVICE_PRODUCT="pA-Converter V5.1 MCUBOOT"

# ---- 分区/升级策略 ----
# swap-move:slot1 不需要与 slot0 等大加一页,512KB 上更省
CONFIG_BOOT_PREFER_SWAP_MOVE=y
CONFIG_BOOT_UPGRADE_ONLY=n
CONFIG_BOOT_BOOTSTRAP=n

# ---- 体积 ----
CONFIG_CBPRINTF_NANO=y
CONFIG_BOOT_BANNER=n
