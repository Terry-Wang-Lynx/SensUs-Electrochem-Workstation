# MCUboot base configuration (NCS 3.4.0) plus the V5.1 USB serial recovery
# settings verified by the hardware handoff.  This child image is included
# only when the build is explicitly given SB_CONFIG_BOOTLOADER_MCUBOOT=y.
CONFIG_PM=n
CONFIG_MAIN_STACK_SIZE=10240
CONFIG_BOOT_SWAP_SAVE_ENCTLV=n
CONFIG_BOOT_ENCRYPT_IMAGE=n
CONFIG_BOOT_UPGRADE_ONLY=n
CONFIG_BOOT_BOOTSTRAP=n
CONFIG_FLASH=y
CONFIG_BT=n
CONFIG_I2C=n
CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_SERIAL=y
CONFIG_UART_NRFX=n
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_GPIO=y
CONFIG_MULTITHREADING=y

CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=5000
CONFIG_BOOT_SERIAL_NO_APPLICATION=y

CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USB_DEVICE_REMOTE_WAKEUP=n
CONFIG_USB_DEVICE_PRODUCT="pA-Converter V5.1 MCUboot"

CONFIG_CBPRINTF_NANO=y
CONFIG_PICOLIBC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="MCUboot"
