name: portable-release

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: "Also build the macOS package"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag against package version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pyproject.toml)"
          test -n "$VERSION"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  macos-arm64:
    if: github.event_name == 'push' || inputs.build_macos == true
    needs: release-metadata
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev,analysis]"
      - name: Run host tests
        run: make test VENV_PYTHON=python
      - name: Install pinned OpenOCD build prerequisite
        run: brew install pkgconf
      - name: Build portable DMG
        env:
          SENSUS_FRONTEND_MANIFEST_URL: ${{ vars.SENSUS_FRONTEND_MANIFEST_URL }}
          SENSUS_FRONTEND_PUBLIC_KEY: ${{ vars.SENSUS_FRONTEND_PUBLIC_KEY }}
        run: make dmg VENV_PYTHON=python PYTHON=python
      - name: Smoke test frozen macOS backend
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import pa_host; print(pa_host.__version__)')"
          test "$VERSION" = "${{ needs.release-metadata.outputs.version }}"
          DMG="$(find "artifacts/releases/$VERSION" -maxdepth 1 -name 'SensUs-Workstation-macOS-arm64-*.dmg' -print -quit)"
          test -n "$DMG"
          hdiutil verify "$DMG"
          MOUNT="$RUNNER_TEMP/sensus-dmg-mount"
          mkdir -p "$MOUNT"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" "$DMG"
          APP="$MOUNT/SensUs Workstation.app"
          BACKEND="$APP/Contents/Resources/backend/SensUsBackend/SensUsBackend"
          WORKSTATION="$APP/Contents/Resources/workstation"
          OPENOCD="$APP/Contents/Resources/tools/openocd/bin/openocd"
          test -f "$APP/Contents/Resources/tools/openocd/COMPONENTS.json"
          test -f "$APP/Contents/Resources/tools/openocd/licenses/OpenOCD-COPYING"
          test -f "$APP/Contents/Resources/tools/openocd/licenses/libusb-COPYING"
          test -f "$APP/Contents/Resources/tools/openocd/source/openocd-0.12.0.tar.bz2"
          test -f "$APP/Contents/Resources/tools/openocd/source/libusb-1.0.29.tar.bz2"
          test -f "$APP/Contents/Resources/tools/openocd/source/build_macos_openocd.sh"
          test -f "$APP/Contents/Resources/THIRD_PARTY_LICENSES/SBOM.spdx.json"
          ADAPTERS="$("$OPENOCD" -c 'echo [adapter list]; shutdown' 2>&1)"
          grep -qi 'jlink' <<<"$ADAPTERS"
          "$BACKEND" collect --help >/dev/null
          PORT="$(python -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
          export SENSUS_PROJECT_DIR="$WORKSTATION"
          export SENSUS_RESOURCE_DIR="$WORKSTATION"
          export SENSUS_STATE_DIR="$RUNNER_TEMP/sensus-smoke-macos"
          "$BACKEND" gui --host 127.0.0.1 --port "$PORT" >"$RUNNER_TEMP/sensus-macos-smoke.log" 2>&1 &
          BACKEND_PID=$!
          cleanup() {
            kill "$BACKEND_PID" 2>/dev/null || true
            hdiutil detach "$MOUNT" -quiet 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 180); do
            if curl --fail --silent "http://127.0.0.1:$PORT/api/health" >"$RUNNER_TEMP/sensus-health.json"; then
              break
            fi
            sleep 0.5
          done
          python - "$VERSION" "$RUNNER_TEMP/sensus-health.json" <<'PY'
          import json, pathlib, sys
          expected, path = sys.argv[1:]
          payload = json.loads(pathlib.Path(path).read_text())
          assert payload["ok"] is True
          assert payload["version"] == expected, payload
          PY
          curl --fail --silent -X POST -H 'Content-Type: application/json' \
            -d '{}' "http://127.0.0.1:$PORT/api/shutdown" >/dev/null
          wait "$BACKEND_PID"
          hdiutil detach "$MOUNT" -quiet
          trap - EXIT
      - uses: actions/upload-artifact@v4
        with:
          name: SensUs-Workstation-macOS-arm64
          path: artifacts/releases/*/SensUs-Workstation-macOS-arm64-*.dmg
          if-no-files-found: error

  windows-x64:
    needs: release-metadata
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned libwdi source
        uses: actions/checkout@v4
        with:
          repository: pbatard/libwdi
          ref: 9b23b82a2dd1cbffc16d46c212f92c6bf8c0c602
          path: artifacts/vendor/libwdi
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            autoconf
            automake
            libtool
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
      - uses: microsoft/setup-msbuild@v2
      - name: Install test dependencies
        run: python -m pip install -e ".[dev,analysis]"
      - name: Run host tests
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
          SENSUS_TRANSPORT: rtt
        run: python -m pytest -q software/host/tests
      - name: Build pinned WinUSB helper
        shell: pwsh
        run: ./packaging/build_windows_winusb_helper.ps1
      - name: Build pinned J-Link-only OpenOCD
        shell: msys2 {0}
        run: ./packaging/build_windows_openocd.sh artifacts/build/windows-x64/openocd
      - name: Build portable ZIP
        shell: pwsh
        env:
          SENSUS_FRONTEND_MANIFEST_URL: ${{ vars.SENSUS_FRONTEND_MANIFEST_URL }}
          SENSUS_FRONTEND_PUBLIC_KEY: ${{ vars.SENSUS_FRONTEND_PUBLIC_KEY }}
        run: ./windows/build_portable.ps1 -Python python
      - name: Smoke test frozen Windows backend
        timeout-minutes: 8
        shell: pwsh
        run: |
          $Version = python -c "import pa_host; print(pa_host.__version__)"
          if ($Version -ne "${{ needs.release-metadata.outputs.version }}") {
            throw "Package version does not match validated release metadata"
          }
          $Zip = Get-ChildItem "artifacts/releases/$Version/SensUs-Workstation-Windows-x64-*.zip" |
            Select-Object -First 1
          if (-not $Zip) { throw "Windows ZIP was not created" }
          $Extracted = Join-Path $env:RUNNER_TEMP "sensus-final-windows"
          Expand-Archive -LiteralPath $Zip.FullName -DestinationPath $Extracted
          $Backend = Join-Path $Extracted "SensUsBackend.exe"
          $OpenOcd = Join-Path $Extracted "tools/openocd/bin/openocd.exe"
          if (-not (Test-Path (Join-Path $Extracted "tools/openocd/COMPONENTS.json"))) {
            throw "OpenOCD component manifest is missing from final ZIP"
          }
          if (-not (Test-Path (Join-Path $Extracted "tools/openocd/licenses/OpenOCD-COPYING"))) {
            throw "OpenOCD license is missing from final ZIP"
          }
          if (-not (Test-Path (Join-Path $Extracted "tools/openocd/source/openocd-0.12.0.tar.bz2"))) {
            throw "OpenOCD source is missing from final ZIP"
          }
          if (-not (Test-Path (Join-Path $Extracted "tools/openocd/source/libusb-1.0.29.tar.bz2"))) {
            throw "libusb source is missing from final ZIP"
          }
          foreach ($Relative in @(
            "tools/openocd/source/build_windows_openocd.sh",
            "tools/openocd/source/bundle_windows_openocd.ps1",
            "tools/winusb/wdi-simple.exe",
            "tools/winusb/libwdi-1.5.1-source.zip",
            "tools/winusb/libusb-win32-COPYING-GPL.txt",
            "tools/winusb/libusb-win32-COPYING-LGPL.txt",
            "tools/winusb/libusbK-LICENSE-BSD.txt",
            "tools/winusb/libusbK-LICENSE-GPL3.txt",
            "tools/winusb/libusbK-LICENSE-LGPL3.txt",
            "tools/winusb/build_windows_winusb_helper.ps1",
            "tools/winusb/COMPONENTS.json"
          )) {
            if (-not (Test-Path (Join-Path $Extracted $Relative))) {
              throw "Required WinUSB/OpenOCD source material is missing: $Relative"
            }
          }
          $WinUsbRoot = Join-Path $Extracted "tools/winusb"
          $WinUsbManifest = Get-Content (Join-Path $WinUsbRoot "COMPONENTS.json") -Raw |
            ConvertFrom-Json
          $Libwdi = @($WinUsbManifest.components | Where-Object name -eq "libwdi")
          if ($Libwdi.Count -ne 1) { throw "Final WinUSB manifest is invalid" }
          $HelperHash = (Get-FileHash -Algorithm SHA256 `
            (Join-Path $WinUsbRoot $Libwdi[0].binary)).Hash.ToLowerInvariant()
          $SourceHash = (Get-FileHash -Algorithm SHA256 `
            (Join-Path $WinUsbRoot $Libwdi[0].source)).Hash.ToLowerInvariant()
          if ($HelperHash -ne $Libwdi[0].binary_sha256 `
              -or $SourceHash -ne $Libwdi[0].source_sha256) {
            throw "Final WinUSB helper hashes do not match COMPONENTS.json"
          }
          if (-not (Test-Path (Join-Path $Extracted "THIRD_PARTY_LICENSES/SBOM.spdx.json"))) {
            throw "Python runtime SBOM is missing from final ZIP"
          }
          $Adapters = (& $OpenOcd -c "echo [adapter list]; shutdown" 2>&1) -join "`n"
          if ($Adapters -notmatch "(?i)jlink") {
            throw "Final Windows OpenOCD does not contain the jlink adapter"
          }
          $CollectorStdout = Join-Path $env:RUNNER_TEMP "sensus-collector-help.out"
          $CollectorStderr = Join-Path $env:RUNNER_TEMP "sensus-collector-help.err"
          $CollectorCheck = Start-Process -FilePath $Backend `
            -ArgumentList @("collect", "--help") -WindowStyle Hidden -PassThru `
            -RedirectStandardOutput $CollectorStdout `
            -RedirectStandardError $CollectorStderr
          try {
            Wait-Process -Id $CollectorCheck.Id -Timeout 60 -ErrorAction Stop
          } catch {
            if (-not $CollectorCheck.HasExited) {
              Stop-Process -Id $CollectorCheck.Id -Force
            }
            throw "Frozen Windows collector entry point did not exit within 60 seconds"
          }
          $CollectorCheck.Refresh()
          if ($CollectorCheck.ExitCode -ne 0) {
            Get-Content $CollectorStderr -ErrorAction SilentlyContinue
            throw "Frozen Windows collector entry point failed its smoke test"
          }
          $env:SENSUS_PROJECT_DIR = Join-Path $Extracted "workstation"
          $env:SENSUS_RESOURCE_DIR = $env:SENSUS_PROJECT_DIR
          $env:SENSUS_STATE_DIR = Join-Path $env:RUNNER_TEMP "sensus-smoke-windows"
          $Port = python -c "import socket; s=socket.socket(); s.bind(('127.0.0.1',0)); print(s.getsockname()[1]); s.close()"
          $Process = Start-Process -FilePath $Backend `
            -ArgumentList @("gui", "--host", "127.0.0.1", "--port", $Port) `
            -WindowStyle Hidden -PassThru
          try {
            $Health = $null
            for ($Attempt = 0; $Attempt -lt 360; $Attempt++) {
              try {
                $Health = Invoke-RestMethod "http://127.0.0.1:$Port/api/health" `
                  -TimeoutSec 2
                break
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $Health) { throw "Frozen Windows backend did not become ready" }
            if ($Health.version -ne $Version) {
              throw "Frozen backend version mismatch: $($Health.version) != $Version"
            }
            Invoke-RestMethod "http://127.0.0.1:$Port/api/shutdown" `
              -Method Post -ContentType "application/json" -Body "{}" `
              -TimeoutSec 30 | Out-Null
            Wait-Process -Id $Process.Id -Timeout 30
          } finally {
            if (-not $Process.HasExited) { Stop-Process -Id $Process.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: SensUs-Workstation-Windows-x64
          path: artifacts/releases/*/SensUs-Workstation-Windows-x64-*.zip
          if-no-files-found: error

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [release-metadata, macos-arm64, windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 🔴 必须 checkout:本 job 用 `body_path: docs/RELEASE_NOTES.md`,而这个 job
      #    原来只 download-artifact、不检出仓库 ⇒ 那个文件不在磁盘上。
      #    0.4.16 实测踩过:action 打出
      #      ⚠️ Failed to read body_path "docs/RELEASE_NOTES.md" (ENOENT).
      #        Falling back to 'body' input.
      #    而内联 body 已被移除 ⇒ **release note 整个是空的**,而且构建全绿、
      #    只在发布前人工核对 body 才会发现。
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: SensUs-Workstation-*
          path: release-assets
          merge-multiple: true
      - name: Verify both platform assets and write checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.release-metadata.outputs.version }}"
          DMG_NAME="SensUs-Workstation-macOS-arm64-$VERSION.dmg"
          ZIP_NAME="SensUs-Workstation-Windows-x64-$VERSION.zip"
          test "$(find release-assets -type f -name "$DMG_NAME" | wc -l)" -eq 1
          test "$(find release-assets -type f -name "$ZIP_NAME" | wc -l)" -eq 1
          DMG="$(find release-assets -type f -name "$DMG_NAME" -print -quit)"
          ZIP="$(find release-assets -type f -name "$ZIP_NAME" -print -quit)"
          mkdir release-files
          cp -- "$DMG" "$ZIP" release-files/
          cd release-files
          sha256sum ./*.dmg ./*.zip > SHA256SUMS.txt
      - name: Create Chinese draft release
        uses: softprops/action-gh-release@v2
        with:
          name: SensUs 电化学工作站 v${{ needs.release-metadata.outputs.version }}
          draft: true
          generate_release_notes: false
          # 🔴 release note 写在 docs/RELEASE_NOTES.md,不要再内联到本文件 ——
          #    内联的那份到 0.4.15 时已经过期(还在讲 0.4.12 的改动),
          #    因为发版的人改版本号不会想到来改 CI。
          body_path: docs/RELEASE_NOTES.md
          files: |
            release-files/*.dmg
            release-files/*.zip
            release-files/SHA256SUMS.txt
