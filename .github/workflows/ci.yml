name: ci

on:
  push:
  pull_request:

jobs:
  host-and-firmware-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package
        run: |
          python -m pip install --require-hashes -r packaging/source-test.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Test Python and browser code
        timeout-minutes: 45
        env:
          PYTEST_ADDOPTS: "-vv -o faulthandler_timeout=90"
        run: make test VENV_PYTHON=python
      - name: Test portable firmware logic
        run: make firmware-test
      - name: Build wheel and source archive
        run: make package VENV_PYTHON=python
