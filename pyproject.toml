[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensus-electrochem-workstation"
version = "0.5.0"
description = "Local GUI and RTT, USB and BLE acquisition for SensUs MAX30131/MAX30134 workstations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
  "pyserial>=3.5",
  "bleak>=1.0,<4",
]

[project.optional-dependencies]
analysis = ["scipy>=1.10"]
dev = ["build>=1.2", "pytest>=8"]
portable = [
  "scipy>=1.10",
  "cryptography>=43",
  "pyinstaller>=6.11",
  "pillow>=10",
  "pywebview>=5.3; sys_platform == 'win32'",
  "smpmgr==0.18.1",
]

[project.scripts]
sensus-workstation = "pa_host.gui_server:main"
sensus-it = "pa_host.it_tool:main"
sensus-collect = "pa_host.collect:main"
sensus-analyze = "pa_host.analyze:main"

[project.urls]
Repository = "https://github.com/Terry-Wang-Lynx/SensUs-Electrochem-Workstation"

[tool.setuptools]
package-dir = {"" = "software/host"}

[tool.setuptools.packages.find]
where = ["software/host"]
include = ["pa_host*"]

[tool.setuptools.package-data]
pa_host = ["gui/*.html", "gui/*.js", "gui/*.css", "gui/*.png", "gui/*.json", "gui/*.txt"]

[tool.pytest.ini_options]
testpaths = ["software/host/tests"]

[tool.sensus.release]
channel = "preview"
publisher = "manual"
